services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: baza
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baza"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://baza:${POSTGRES_PASSWORD}@db:5432/baza
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_CURRENCY: ${CURRENCY:-LKR}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@example.com}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Business Owner}
      SEED_BRANCH_NAME: ${SEED_BRANCH_NAME:-Main Branch}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      CRON_TOKEN: ${CRON_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Baza ERP <onboarding@resend.dev>}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    volumes:
      - uploads_data:/app/public/uploads

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      # Nginx serves uploaded photos/documents directly from this shared
      # volume (read-only) instead of proxying to the app — the Next.js
      # standalone server only serves public/ files that existed at build
      # time, so anything uploaded later would otherwise 404. See DEPLOY.md.
      - uploads_data:/uploads-data:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # This entrypoint is only for the long-running renewal loop started by
    # `docker compose up -d certbot`. It overrides the image's own
    # entrypoint, so a one-off `docker compose run certbot <command>` must
    # pass `--entrypoint certbot` or it silently runs this loop instead of
    # the command you asked for. See DEPLOY.md's certonly step.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done;'"

volumes:
  db_data:
  uploads_data:
  certbot_www:
  certbot_conf:
