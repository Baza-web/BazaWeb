## STEP 2 of 2: use this once certbot has issued a certificate.
## Copy this file to nginx/conf.d/app.conf (replacing app.http-only.conf),
## replace YOUR_DOMAIN, then `docker compose exec nginx nginx -s reload`.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    client_max_body_size 20m;

    # Served directly from disk, not the Next.js app — see docker-compose.yml.
    location /uploads/ {
        alias /uploads-data/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
