## STEP 1 of 2: use this config to get your first TLS certificate.
## Copy this file to nginx/conf.d/app.conf, replace YOUR_DOMAIN, start the
## stack, then request the certificate (see the deployment guide). Once
## that succeeds, switch to app.ssl.conf instead.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Served directly from disk, not the Next.js app — see docker-compose.yml.
    location /uploads/ {
        alias /uploads-data/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
